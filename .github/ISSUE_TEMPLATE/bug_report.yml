name: Bug report
description: Something in Klubkern does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Please do not post personal data of club
        members, passwords or access tokens here. Security problems go through
        private reporting instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, and what did you see?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      options:
        - Admin area
        - Member portal
        - Public pages
        - Terminal / kiosk
        - E-mails
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in the footer or under "About", if you know it.
  - type: textarea
    id: environment
    attributes:
      label: Device and browser
      placeholder: e.g. iPhone 15, Safari 18
