name: Feature request
description: Suggest an idea or an improvement for Klubkern.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation in your club where you miss something.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How do you handle it today?
      description: Workarounds or other tools you use for it.
  - type: dropdown
    id: who
    attributes:
      label: Who would use it?
      multiple: true
      options:
        - Board / administrators
        - Department leads
        - Members
        - Visitors of the public pages
